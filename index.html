<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#f5f1e9">
    <title>Threefold Habit Tracker</title>
    <style>
        *{box-sizing:border-box}
        :root{--paper:#f5f1e9;--ink:#1e2a25;--muted:#718078;--line:#d8ddd5;--card:#fffdf9;--good:#23845e;--good-bg:#dcefe5;--avoid:#7954aa;--avoid-bg:#e9e1f5;--bad:#bd4b43;--bad-bg:#f5dfdc}
        body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}
        button{font:inherit;color:inherit}
        .app{max-width:1080px;margin:auto;padding:28px 18px 48px}
        .top{display:flex;justify-content:space-between;align-items:start;margin-bottom:28px}
        .brand{display:flex;align-items:center;gap:12px}
        .mark{display:flex;gap:3px;width:42px;height:42px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
        .mark i{flex:1;border-radius:3px}
        .mark i:first-child{background:var(--good)}
        .mark i:nth-child(2){background:var(--avoid)}
        .mark i:last-child{background:var(--bad)}
        .eyebrow,.date-label,.section-label,.count{font:11px/1.3 monospace;letter-spacing:.08em;text-transform:uppercase}
        .eyebrow,.date-label,.section-label{color:var(--muted)}
        h1,h2,p{margin:0}
        h1{font-size:32px;letter-spacing:-.06em;line-height:1}
        .date-label{text-align:right;margin-top:9px}
        .layout{display:grid;grid-template-columns:minmax(290px,.9fr) minmax(450px,1.25fr);gap:22px}
        .left-col{display:flex;flex-direction:column;gap:18px;max-width:360px}
        .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 36px #3140380d}
        .actions{padding:20px}
        .actions h2{font-size:25px;letter-spacing:-.05em;margin:6px 0}
        .intro{max-width:380px;color:var(--muted);font:12px/1.5 Arial,sans-serif}
        .buttons{display:grid;gap:8px;margin-top:18px}
        .action{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;min-height:64px;padding:10px;border:1px solid transparent;border-radius:12px;text-align:left;cursor:pointer;transition:.15s}
        .action:hover{transform:translateY(-2px);box-shadow:0 8px 15px #30403818}
        .action:active{transform:scale(.985)}
        .good{background:var(--good-bg);border-color:#c6e5d4}
        .avoid{background:var(--avoid-bg);border-color:#d9cceb}
        .bad{background:var(--bad-bg);border-color:#efd0cb}
        .icon{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;color:#fff;font:bold 20px Arial}
        .good .icon{background:var(--good)}
        .avoid .icon{background:var(--avoid)}
        .bad .icon{background:var(--bad)}
        .title{display:block;font:bold 13px Arial,sans-serif}
        .hint{display:block;color:#304038aa;font:10px Arial,sans-serif;margin-top:2px}
        .count{color:#304038aa}
        .summary{display:flex;justify-content:space-between;align-items:end;border-top:1px solid var(--line);margin-top:20px;padding-top:16px}
        .total{font:bold 32px Arial,sans-serif;letter-spacing:-.08em}
        .total-caption{color:var(--muted);font:10px Arial,sans-serif;margin-top:3px}
        
        /* Separate Line Graph Window */
        .analytics-panel{padding:18px}
        .analytics-panel h3{font-size:18px;letter-spacing:-.04em;margin-bottom:4px}
        .analytics-desc{color:var(--muted);font:11px Arial,sans-serif;margin-bottom:12px}
        .graph-container{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px 8px;height:180px;position:relative}
        .graph-container svg{display:block;width:100%;height:100%;overflow:visible}

        .calendar{padding:24px}
        .calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
        .calendar-head h2{font-size:22px;letter-spacing:-.05em}
        .controls{display:flex;gap:6px}
        .controls button{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--paper);cursor:pointer;font-size:20px}
        .controls button:hover{background:var(--ink);color:#fff}
        .week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
        .week{margin-bottom:6px}
        .week span{color:var(--muted);font:10px monospace;text-align:center}
        .day{display:flex;flex-direction:column;justify-content:space-between;min-height:67px;padding:8px;border:1px solid transparent;border-radius:10px;background:#f7f6f1;text-align:left;cursor:pointer}
        .day:hover{border-color:#9eaaa0}
        .day.selected{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
        .day.today .number{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--ink);color:#fff}
        .number{font:11px monospace}
        .dots{display:flex;gap:3px}
        .dot{width:7px;height:7px;border-radius:50%}
        .dot.good{background:var(--good)}
        .dot.avoid{background:var(--avoid)}
        .dot.bad{background:var(--bad)}
        .legend{display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:20px;padding-top:16px;color:var(--muted);font:11px Arial,sans-serif}
        .legend span{display:flex;align-items:center;gap:6px}
        @media(max-width:760px){.app{padding:20px 14px 38px}.layout{display:flex;flex-direction:column}.panel{width:100%}}
    </style>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <main class="app">
        <header class="top">
            <div class="brand">
                <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
                <div><p class="eyebrow">daily action log</p><h1>Threefold</h1></div>
            </div>
            <p class="date-label" id="date-label"></p>
        </header>
        <div class="layout">
            <div class="left-col">
                <section class="panel actions" aria-labelledby="question">
                    <p class="section-label">Make a note</p>
                    <h2 id="question">How did today go?</h2>
                    <p class="intro">Tap once to record a moment. Entries stay on this device.</p>
                    <div class="buttons">
                        <button class="action good" data-type="good">
                            <span class="icon">+</span>
                            <span><span class="title">Good action</span><span class="hint">Glad you did</span></span>
                            <span class="count" data-count="good">0</span>
                        </button>
                        <button class="action avoid" data-type="avoid">
                            <span class="icon">−</span>
                            <span><span class="title">Chose not to</span><span class="hint">Avoided bad action</span></span>
                            <span class="count" data-count="avoid">0</span>
                        </button>
                        <button class="action bad" data-type="bad">
                            <span class="icon">!</span>
                            <span><span class="title">Bad action</span><span class="hint">Would change</span></span>
                            <span class="count" data-count="bad">0</span>
                        </button>
                    </div>
                    <div class="summary">
                        <div>
                            <div class="total" id="total">0</div>
                            <div class="total-caption">actions logged</div>
                        </div>
                    </div>
                </section>

                <!-- Separate Line Graph Window Below -->
                <section class="panel analytics-panel">
                    <h3>Trend Analytics</h3>
                    <p class="analytics-desc">Comparing Good, Avoid, and Bad entries over time.</p>
                    <div class="graph-container">
                        <svg id="trend-line-graph" viewBox="0 0 260 110" style="width:100%;height:100%;overflow:visible;">
                            <polyline id="line-good" fill="none" stroke="#23845e" stroke-width="2.5" points="0,110 260,110"></polyline>
                            <polyline id="line-avoid" fill="none" stroke="#7954aa" stroke-width="2.5" points="0,110 260,110"></polyline>
                            <polyline id="line-bad" fill="none" stroke="#bd4b43" stroke-width="2.5" points="0,110 260,110"></polyline>
                        </svg>
                    </div>
                </section>
            </div>

            <section class="panel calendar" aria-labelledby="month">
                <div class="calendar-head">
                    <h2 id="month"></h2>
                    <div class="controls">
                        <button id="previous" aria-label="Previous month">‹</button>
                        <button id="next" aria-label="Next month">›</button>
                    </div>
                </div>
                <div class="week" aria-hidden="true"><span>sun</span><span>mon</span><span>tue</span><span>wed</span><span>thu</span><span>fri</span><span>sat</span></div>
                <div class="grid" id="grid"></div>
                <div class="legend">
                    <span><i class="dot good"></i> good</span>
                    <span><i class="dot avoid"></i> chose not to</span>
                    <span><i class="dot bad"></i> bad</span>
                </div>
            </section>
        </div>
    </main>

    <script>
        const key = 'threefold_data';
        let data = JSON.parse(localStorage.getItem(key) || '{}');
        const today = new Date(), dateKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        let selected = new Date(today), shown = new Date(today);
        const counts = d => data[dateKey(d)] || { good: 0, avoid: 0, bad: 0 };
        const dateText = d => d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

        function renderSelected() {
            const c = counts(selected), total = c.good + c.avoid + c.bad;
            document.getElementById('date-label').textContent = dateKey(selected) === dateKey(today) ? `Today · ${dateText(selected)}` : dateText(selected);
            document.querySelectorAll('[data-count]').forEach(e => e.textContent = c[e.dataset.count]);
            document.getElementById('total').textContent = total;
            renderTrendGraph();
        }

        function renderTrendGraph() {
            const days = [];
            for (let offset = 6; offset >= 0; offset--) {
                const d = new Date(selected);
                d.setDate(d.getDate() - offset);
                days.push({ label: d, values: counts(d) });
            }

            const maxVal = Math.max(...days.flatMap(day => [day.values.good, day.values.avoid, day.values.bad]), 5);
            const w = 260, h = 110, pad = 8;
            const xAt = (index) => {
                if (days.length === 1) return pad;
                return pad + (index / (days.length - 1)) * (w - pad * 2);
            };
            const yAt = (value) => h - pad - (value / maxVal) * (h - pad * 2);

            const pointsFor = (type) => days.map((day, index) => `${xAt(index)},${yAt(day.values[type])}`).join(' ');
            document.getElementById('line-good').setAttribute('points', pointsFor('good'));
            document.getElementById('line-avoid').setAttribute('points', pointsFor('avoid'));
            document.getElementById('line-bad').setAttribute('points', pointsFor('bad'));
        }

        function renderCalendar() {
            const month = document.getElementById('month'), grid = document.getElementById('grid');
            month.textContent = shown.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            const first = new Date(shown.getFullYear(), shown.getMonth(), 1), last = new Date(shown.getFullYear(), shown.getMonth() + 1, 0), cells = [];
            for (let i = 0; i < first.getDay(); i++) cells.push('<span></span>');
            for (let n = 1; n <= last.getDate(); n++) {
                const d = new Date(shown.getFullYear(), shown.getMonth(), n), c = counts(d), k = dateKey(d), dots = Object.entries(c).map(([t, v]) => v ? `<i class="dot ${t}" title="${v} ${t}"></i>` : '').join('');
                cells.push(`<button class="day ${k === dateKey(selected) ? 'selected' : ''} ${k === dateKey(today) ? 'today' : ''}" data-date="${k}" aria-label="${dateText(d)}"><span class="number">${n}</span><span class="dots">${dots}</span></button>`);
            }
            grid.innerHTML = cells.join('');
            grid.querySelectorAll('[data-date]').forEach(b => b.onclick = () => { selected = new Date(`${b.dataset.date}T00:00:00`); renderSelected(); renderCalendar(); });
        }

        document.querySelectorAll('.action').forEach(b => b.onclick = () => {
            const k = dateKey(selected), c = counts(selected);
            c[b.dataset.type]++;
            data[k] = c;
            localStorage.setItem(key, JSON.stringify(data));
            renderSelected();
            renderCalendar();
        });

        document.getElementById('previous').onclick = () => { shown.setMonth(shown.getMonth() - 1); renderCalendar(); };
        document.getElementById('next').onclick = () => { shown.setMonth(shown.getMonth() + 1); renderCalendar(); };
        renderSelected();
        renderCalendar();
    </script>
</body>
</html>
