<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f4f1eb">
	<title>Threefold | Daily action log</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');

		:root {
			--paper: #f4f1eb;
			--ink: #1d2925;
			--muted: #718078;
			--line: #d9ddd5;
			--green: #1f805c;
			--green-soft: #dcefe5;
			--red: #be4a42;
			--red-soft: #f5dfdc;
			--purple: #7753a8;
			--purple-soft: #e8e0f5;
			--card: #fffdf9;
			--shadow: 0 16px 42px rgba(47, 57, 49, .08);
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			color: var(--ink);
			background: var(--paper);
			font-family: Manrope, sans-serif;
			min-width: 320px;
		}
		button { font: inherit; }
		.app-shell { max-width: 1120px; margin: 0 auto; padding: 30px 24px 54px; }
		header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 34px; }
		.brand { display: flex; gap: 13px; align-items: center; }
		.brand-mark { width: 42px; height: 42px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 8px; border: 1px solid var(--line); border-radius: 13px; background: var(--card); }
		.brand-mark span:nth-child(1) { background: var(--green); border-radius: 5px 2px 2px 5px; }
		.brand-mark span:nth-child(2) { background: var(--purple); border-radius: 2px; }
		.brand-mark span:nth-child(3) { background: var(--red); border-radius: 2px 5px 5px 2px; }
		.eyebrow { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 4px; }
		h1, h2, p { margin: 0; }
		h1 { font-size: clamp(24px, 4vw, 33px); letter-spacing: -.055em; line-height: 1; }
		.today-label { color: var(--muted); font-size: 13px; padding-top: 8px; text-align: right; }
		.layout { display: grid; grid-template-columns: minmax(280px, .9fr) minmax(440px, 1.35fr); gap: 24px; align-items: start; }
		.panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
		.action-panel { padding: clamp(22px, 4vw, 38px); }
		.section-kicker { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
		.action-panel h2 { font-size: 27px; letter-spacing: -.05em; margin: 8px 0 10px; }
		.intro { max-width: 390px; color: var(--muted); font-size: 13px; line-height: 1.65; }
		.action-list { display: grid; gap: 11px; margin-top: 28px; }
		.action { position: relative; display: grid; grid-template-columns: 43px 1fr auto; gap: 14px; align-items: center; width: 100%; min-height: 74px; padding: 13px 17px 13px 13px; border: 1px solid transparent; border-radius: 16px; color: var(--ink); text-align: left; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
		.action:hover { transform: translateY(-2px); box-shadow: 0 7px 14px rgba(50, 55, 50, .1); }
		.action:active { transform: translateY(1px) scale(.99); }
		.action:focus-visible { outline: 3px solid #252d28; outline-offset: 3px; }
		.action.good { background: var(--green-soft); border-color: #c9e5d5; }
		.action.avoid { background: var(--purple-soft); border-color: #d9cbed; }
		.action.bad { background: var(--red-soft); border-color: #efd0cb; }
		.action-icon { width: 43px; height: 43px; display: grid; place-items: center; border-radius: 12px; color: white; font-size: 21px; font-weight: 800; }
		.good .action-icon { background: var(--green); }
		.avoid .action-icon { background: var(--purple); }
		.bad .action-icon { background: var(--red); }
		.action-title { display: block; font-size: 14px; font-weight: 800; }
		.action-caption { display: block; color: rgba(29, 41, 37, .65); font-size: 11px; margin-top: 2px; }
		.action-count { color: rgba(29, 41, 37, .65); font-family: 'DM Mono', monospace; font-size: 13px; }
		.today-summary { border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: end; gap: 15px; margin-top: 31px; padding-top: 21px; }
		.total { font-size: 34px; font-weight: 800; letter-spacing: -.06em; line-height: 1; }
		.total-label { color: var(--muted); font-size: 11px; margin-top: 5px; }
		.mini-bars { display: flex; align-items: end; gap: 5px; height: 35px; }
		.mini-bars i { display: block; width: 9px; min-height: 5px; border-radius: 4px 4px 1px 1px; }
		.mini-bars i:nth-child(1) { background: var(--green); }
		.mini-bars i:nth-child(2) { background: var(--purple); }
		.mini-bars i:nth-child(3) { background: var(--red); }
		.calendar-panel { padding: 24px; }
		.calendar-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
		.calendar-top h2 { font-size: 21px; letter-spacing: -.05em; }
		.calendar-controls { display: flex; gap: 7px; }
		.icon-button { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); cursor: pointer; font-size: 17px; }
		.icon-button:hover { background: var(--ink); color: white; }
		.weekday-row, .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
		.weekday-row { margin-bottom: 7px; }
		.weekday-row span { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 10px; text-align: center; }
		.day { position: relative; display: flex; min-height: 67px; flex-direction: column; justify-content: space-between; padding: 8px; border: 1px solid transparent; border-radius: 11px; background: #f7f6f1; cursor: pointer; text-align: left; }
		.day:hover { border-color: #a9b4ab; }
		.day.muted { opacity: .33; }
		.day.selected { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
		.day.today .date-number { display: grid; width: 23px; height: 23px; place-items: center; border-radius: 50%; background: var(--ink); color: white; }
		.date-number { align-self: flex-start; font-family: 'DM Mono', monospace; font-size: 11px; }
		.day-dots { display: flex; gap: 3px; }
		.dot { width: 6px; height: 6px; border-radius: 50%; }
		.dot.good { background: var(--green); }
		.dot.avoid { background: var(--purple); }
		.dot.bad { background: var(--red); }
		.legend { display: flex; flex-wrap: wrap; gap: 16px; border-top: 1px solid var(--line); margin-top: 21px; padding-top: 17px; }
		.legend-item { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
		.legend .dot { width: 8px; height: 8px; }
		.empty { grid-column: span 7; padding: 32px 0; color: var(--muted); font-size: 13px; text-align: center; }
		.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
		@media (max-width: 760px) {
			.app-shell { padding: 22px 15px 42px; }
			header { margin-bottom: 25px; }
			.today-label { font-size: 11px; }
			.layout { display: flex; flex-direction: column; }
			.action-panel, .calendar-panel { width: 100%; }
			.calendar-panel { padding: 18px 12px 20px; }
			.day { min-height: 56px; padding: 6px; }
			.weekday-row, .calendar-grid { gap: 4px; }
		}
		@media (max-width: 390px) {
			.action-panel { padding: 20px 16px; }
			.action { grid-template-columns: 38px 1fr auto; min-height: 67px; gap: 10px; padding-right: 11px; }
			.action-icon { width: 38px; height: 38px; }
			.action-caption { font-size: 10px; }
			.day { min-height: 51px; }
		}
	</style>
</head>
<body>
	<main class="app-shell">
		<header>
			<div class="brand">
				<div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
				<div><p class="eyebrow">your daily log</p><h1>Threefold</h1></div>
			</div>
			<p class="today-label" id="selected-date-label"></p>
		</header>

		<div class="layout">
			<section class="panel action-panel" aria-labelledby="action-heading">
				<p class="section-kicker">Make a note</p>
				<h2 id="action-heading">How did today go?</h2>
				<p class="intro">A quick tap is all it takes. Record the moments you want to remember, without judgment.</p>
				<div class="action-list">
					<button class="action good" data-type="good"><span class="action-icon" aria-hidden="true">+</span><span><span class="action-title">Good action</span><span class="action-caption">Something you are glad you did</span></span><span class="action-count" data-count="good">0</span></button>
					<button class="action avoid" data-type="avoid"><span class="action-icon" aria-hidden="true">−</span><span><span class="action-title">Chose not to</span><span class="action-caption">Avoided a bad action</span></span><span class="action-count" data-count="avoid">0</span></button>
					<button class="action bad" data-type="bad"><span class="action-icon" aria-hidden="true">!</span><span><span class="action-title">Bad action</span><span class="action-caption">Something you would change</span></span><span class="action-count" data-count="bad">0</span></button>
				</div>
				<div class="today-summary"><div><div class="total" id="total-count">0</div><div class="total-label">actions logged today</div></div><div class="mini-bars" id="mini-bars" aria-label="Today's action balance"></div></div>
			</section>

			<section class="panel calendar-panel" aria-labelledby="calendar-heading">
				<div class="calendar-top"><h2 id="calendar-heading"></h2><div class="calendar-controls"><button class="icon-button" id="previous-month" aria-label="Previous month">‹</button><button class="icon-button" id="next-month" aria-label="Next month">›</button></div></div>
				<div class="weekday-row" aria-hidden="true"><span>sun</span><span>mon</span><span>tue</span><span>wed</span><span>thu</span><span>fri</span><span>sat</span></div>
				<div class="calendar-grid" id="calendar-grid"></div>
				<div class="legend"><span class="legend-item"><i class="dot good"></i> good</span><span class="legend-item"><i class="dot avoid"></i> chose not to</span><span class="legend-item"><i class="dot bad"></i> bad</span></div>
			</section>
		</div>
	</main>

	<script>
		const STORAGE_KEY = 'threefold-action-log';
		const today = new Date();
		let selectedDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
		let visibleMonth = new Date(today.getFullYear(), today.getMonth(), 1);
		let log = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

		const dateKey = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
		const getCounts = date => log[dateKey(date)] || { good: 0, avoid: 0, bad: 0 };
		const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
		const monthName = date => date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
		const fullDate = date => date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

		function renderSelectedDay() {
			const counts = getCounts(selectedDate);
			document.getElementById('selected-date-label').textContent = dateKey(selectedDate) === dateKey(today) ? 'Today · ' + fullDate(selectedDate) : fullDate(selectedDate);
			document.querySelectorAll('[data-count]').forEach(element => element.textContent = counts[element.dataset.count]);
			const total = counts.good + counts.avoid + counts.bad;
			document.getElementById('total-count').textContent = total;
			document.getElementById('mini-bars').innerHTML = Object.entries(counts).map(([type, count]) => `<i class="${type}" style="height:${Math.max(5, Math.min(35, count * 8))}px" title="${count} ${type}"></i>`).join('');
		}

		function renderCalendar() {
			document.getElementById('calendar-heading').textContent = monthName(visibleMonth);
			const grid = document.getElementById('calendar-grid');
			const firstDay = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth(), 1);
			const daysInMonth = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth() + 1, 0).getDate();
			const cells = [];
			for (let i = 0; i < firstDay.getDay(); i++) cells.push('<div class="day muted" aria-hidden="true"></div>');
			for (let day = 1; day <= daysInMonth; day++) {
				const date = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth(), day);
				const key = dateKey(date);
				const counts = getCounts(date);
				const dots = Object.entries(counts).map(([type, count]) => count ? `<i class="dot ${type}" title="${count} ${type}"></i>` : '').join('');
				const classes = ['day', key === dateKey(selectedDate) ? 'selected' : '', key === dateKey(today) ? 'today' : ''].join(' ');
				cells.push(`<button class="${classes}" data-date="${key}" aria-label="${fullDate(date)}${counts.good + counts.avoid + counts.bad ? `, ${counts.good + counts.avoid + counts.bad} actions` : ''}"><span class="date-number">${day}</span><span class="day-dots">${dots}</span></button>`);
			}
			grid.innerHTML = cells.join('');
			grid.querySelectorAll('[data-date]').forEach(button => button.addEventListener('click', () => { selectedDate = new Date(`${button.dataset.date}T00:00:00`); renderSelectedDay(); renderCalendar(); }));
		}

		document.querySelectorAll('.action').forEach(button => button.addEventListener('click', () => {
			const key = dateKey(selectedDate);
			const counts = getCounts(selectedDate);
			counts[button.dataset.type]++;
			log[key] = counts;
			save();
			renderSelectedDay();
			renderCalendar();
		}));
		document.getElementById('previous-month').addEventListener('click', () => { visibleMonth.setMonth(visibleMonth.getMonth() - 1); renderCalendar(); });
		document.getElementById('next-month').addEventListener('click', () => { visibleMonth.setMonth(visibleMonth.getMonth() + 1); renderCalendar(); });
		renderSelectedDay();
		renderCalendar();
	</script>
</body>
</html>
